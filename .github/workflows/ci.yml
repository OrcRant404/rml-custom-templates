name: Catalog tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    name: Catalog core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test catalog storage and document links
        run: ./scripts/test

      # Native UI, snapshot serialization, and PlaceN transitions require the
      # pinned macOS Studio installation; catalog tests do not prove those.
